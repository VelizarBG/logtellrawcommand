plugins {
	id 'fabric-loom' version '1.14.5'
	id 'me.modmuss50.mod-publish-plugin' version '1.1.+'
	id 'maven-publish'
}

version = project.mod_version + '+' + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		officialMojangMappings { nameSyntheticMembers = true }
		parchment("org.parchmentmc.data:parchment-${project.parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "loader_dependency", project.loader_dependency

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_dependency": project.minecraft_dependency,
				"loader_dependency": project.loader_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.20.5 upwards uses Java 21.
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
	file = remapJar.archiveFile
	additionalFiles.from(remapSourcesJar.archiveFile)
	version = "$project.version"
	displayName = "v$project.mod_version+$project.title_version"
	type = STABLE
	modLoaders = ["fabric"]

	System.getenv("changelog")?.with { String changelogg ->
		changelog = changelogg
	}

	System.getenv("curse_api_key")?.with { String key ->
		curseforge {
			accessToken = key
			projectId = project.curseforge_id
			minecraftVersions = [*project.release_versions.split(" ")]
			javaVersions.add(JavaVersion.VERSION_21)
		}
	}

	System.getenv("modrinth_key")?.with { String key ->
		modrinth {
			accessToken = key
			projectId = project.modrinth_id
			minecraftVersions = [*project.release_versions.split(" ")]
		}
	}

	// When dry run is enabled the release assets will be saved to the build directory for testing.
//	dryRun = true
}
